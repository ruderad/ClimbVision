[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climbvision"
version = "1.5.0"
description = "Movement analysis from video: pose, centre of mass, stability."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "imageio-ffmpeg>=0.4",  # H.264 videos that play in any browser (viewer, annotated.mp4)
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
rtm = ["rtmlib>=0.0.13", "onnxruntime>=1.16"]

[project.scripts]
climbvision = "climbvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climbvision = ["recipes/library/*.yaml", "output/vendor/*", "output/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: re-analyse the real reference clips (~15 s)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/climbvision/output/viewer.py" = ["E501"]
"src/climbvision/output/wallmark.py" = ["E501"]  # the HTML/JS template
