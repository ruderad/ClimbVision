[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climbvision"
version = "0.2.0"
description = "Movement analysis from video: pose, centre of mass, stability."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
    "matplotlib>=3.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
rtm = ["rtmlib>=0.0.13", "onnxruntime>=1.16"]

[project.scripts]
climbvision = "climbvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climbvision = ["recipes/library/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["regression: re-analyse the real reference clips (~15 s)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
